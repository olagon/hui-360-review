name: app request

# Settings, Ask for a change (temporary). The app opens an issue and adds the app-request label.
# Claude Code works on its own branch, and "test and deploy" tests it. Nothing reaches main until
# an admin presses Approve in the app. Remove this file when the feature goes.
on:
  issues:
    types: [labeled]

concurrency: app-request

jobs:
  claude:
    if: github.event.label.name == 'app-request' && github.actor == github.repository_owner
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
      issues: write
      pull-requests: write
      id-token: write
      actions: read
    steps:
      - uses: actions/checkout@v5
        with: { fetch-depth: 1 }
      - uses: actions/setup-node@v5
        with: { node-version: 24, cache: npm }
      - run: npm ci
      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          label_trigger: app-request
          claude_args: |
            --max-turns 80
            --allowedTools "Bash(npm test),Bash(node --check:*)"
          settings: '{"permissions":{"deny":["Edit(.github/**)","Write(.github/**)","Edit(wrangler.toml)","Write(wrangler.toml)","Edit(workers/**)","Write(workers/**)"]}}'
