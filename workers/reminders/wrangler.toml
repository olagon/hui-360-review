# Optional. Deploy only if you set up Twilio or Resend.
#   npx wrangler deploy -c workers/reminders/wrangler.toml
#   npx wrangler secret put CRON_SECRET -c workers/reminders/wrangler.toml
# Set the same CRON_SECRET on the Pages project.
name = "hui360-reminders"
main = "index.js"
compatibility_date = "2026-09-01"

[vars]
APP_URL = "https://huimau.actionsmatter.com"

[triggers]
crons = ["0 17 * * *"] # 17:00 UTC is 7am in Hawaiʻi
