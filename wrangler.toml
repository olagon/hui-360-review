# Cloudflare Pages project. Bindings here apply to local dev and to deploys.
name = "hui-360"
pages_build_output_dir = "public"
compatibility_date = "2026-09-01"
compatibility_flags = ["nodejs_compat"]

[vars]
# Filled in during setup. See README, "Set up Cloudflare Access" and "AI Gateway".
ACCESS_TEAM_DOMAIN = "https://wispy-hall-957e.cloudflareaccess.com"
ACCESS_AUD = "cf838f0723c46c9ff8b5d7c98bc66c30ffa17b500d6c2379f1750d9f9e98d8f4"
CF_ACCOUNT_ID = "9d4206418d10ed67812b7e4ff70d098b"
AI_GATEWAY_ID = "hui360"

[[d1_databases]]
binding = "DB"
database_name = "hui360_db"
database_id = "a96f92db-2d62-413e-b005-5eb150ba4fda"
migrations_dir = "migrations"

# R2 bucket names cannot contain underscores.
[[r2_buckets]]
binding = "MEDIA"
bucket_name = "hui360-media"

[[kv_namespaces]]
binding = "KV"
id = "1e336d64281e4746bd57506e77324b76"

[ai]
binding = "AI"
